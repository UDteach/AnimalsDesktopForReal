<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file:; media-src file:; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    #animal, #motion-video { position: absolute; left: 0; bottom: 0; opacity: 0; pointer-events: none; will-change: transform, opacity; }
    #animal { max-height: 72vh; object-fit: contain; object-position: bottom; }
    [hidden] { display: none !important; }
    #animal:is(.chinchilla-hop, .chinchilla-perch, .chinchilla-peek, .hamster-peek, .djungarian-pause, .djungarian-peek, .macaroni-emerge, .macaroni-settle, .sugar-glider-perch, .sugar-glider-peek),
    #motion-video:is(.chinchilla-hop, .chinchilla-perch, .chinchilla-peek, .hamster-peek, .djungarian-pause, .djungarian-peek, .macaroni-emerge, .macaroni-settle, .sugar-glider-perch, .sugar-glider-peek) {
      animation: edge-pop 4s linear both;
    }
    #animal:is(.hamster-forage, .hamster-explore, .macaroni-shuffle),
    #motion-video:is(.hamster-forage, .hamster-explore, .macaroni-shuffle) {
      animation: edge-walk 4s linear both;
    }
    #animal.djungarian-dash, #motion-video.djungarian-dash { animation: edge-dash 4s linear both; }
    #motion-video.sugar-glider-glide { left: -45vw; bottom: 22vh; animation: sky-glide 4s linear both; }
    #motion-video:is(.chinchilla-bottom-pop, .hamster-bottom-pop, .djungarian-bottom-pop, .macaroni-bottom-pop) {
      bottom: 0; opacity: 1; transform: translateX(-50%); animation: none;
    }
    @keyframes edge-pop {
      0%, 7%, 100% { opacity: 1; transform: translateX(-115%); }
      19% { opacity: 1; transform: translateX(-26%); }
      26%, 72% { opacity: 1; transform: translateX(-18%); }
      81% { opacity: 1; transform: translateX(-24%); }
      93% { opacity: 1; transform: translateX(-115%); }
    }
    @keyframes edge-walk {
      0%, 5% { opacity: 0; transform: translateX(-80%); }
      25% { opacity: 1; transform: translateX(-18%); }
      70% { opacity: 1; transform: translateX(3%); }
      100% { opacity: 0; transform: translateX(60%); }
    }
    @keyframes edge-dash {
      0%, 5% { opacity: 1; transform: translateX(-115%); }
      20% { opacity: 1; transform: translateX(-12%); }
      74% { opacity: 1; transform: translateX(210%); }
      100% { opacity: 1; transform: translateX(285%); }
    }
    @keyframes sky-glide {
      0% { opacity: 1; transform: translate(0, -2vh); }
      100% { opacity: 1; transform: translate(145vw, 8vh); }
    }
  </style>
</head>
<body>
  <img id="animal" alt="">
  <video id="motion-video" muted playsinline hidden></video>
  <script src="overlay.js"></script>
</body>
</html>
