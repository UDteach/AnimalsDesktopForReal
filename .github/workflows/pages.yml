name: Publish website
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'web/**'
      - 'shared/**'
      - 'research/variants.json'
      - 'electron/catalog.js'
      - 'electron/main.js'
      - 'scripts/check-assets.js'
      - 'scripts/build-obs-web.js'
      - 'test/obs-web.test.mjs'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run check:obs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
